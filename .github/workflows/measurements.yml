name: Game measurements

# Each week, sums up the game sessions the telemetry server received into the
# results of the game sheets in catalog/games/ (telemetry/sheets.py,
# telemetry/README.md#game-sheets): one result for each iPhone model that at
# least three iPhones played a game on in the last 28 days. A game of
# nxnative's list that has no sheet gets one with its first result. It reads
# the D1 database in the account of the zone cartouche.cloud (decision 158)
# with the secret CLOUDFLARE_DOMAIN_TOKEN of the environment cloudflare, and
# does nothing while it is not set. main takes no push: the sheets that changed, and the new
# ones, go on the branch catalog-measurements, and the summary links the pull
# request to open from it, each Thursday morning, and lists the new sheets.

on:
  schedule:
    - cron: "41 4 * * 4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: measurements
  cancel-in-progress: false

jobs:
  sum:
    name: Sum up the measurements
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare
    outputs:
      changed: ${{ steps.sum.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the sessions and write the sheets
        id: sum
        env:
          # The Domain workflow's token: the database is in the zone's account (decision 158).
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DOMAIN_TOKEN }}
        run: |
          CLOUDFLARE_ACCOUNT_ID="$(telemetry/account.sh)"
          export CLOUDFLARE_ACCOUNT_ID
          python3 telemetry/sheets.py --catalog catalog --out build/sheets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ steps.sum.outputs.changed == 'true' }}
        with:
          name: game-sheets
          path: build/sheets
          retention-days: 14
          if-no-files-found: error

  # The only job that can write holds no secret and runs git, gh and the
  # check of telemetry/sheets.py only: it commits the sheets the first job
  # wrote.
  keep:
    name: Keep the sheets on a branch
    needs: sum
    if: ${{ needs.sum.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the branch catalog-measurements
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: catalog-measurements
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: game-sheets
          path: build/sheets
      - name: Push them to catalog-measurements
        run: |
          # Only sheets main has already, or new ones of games of
          # catalog/nxnative.json, each named by its title ID: none
          # otherwise.
          python3 telemetry/sheets.py --catalog catalog --take build/sheets
          git add catalog/games
          NEW="$(git diff --cached --name-only --diff-filter=A -- catalog/games)"
          DAY="$(date -u +%Y-%m-%d)"
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Game sheets: the measurements of the 28 days before $DAY" \
                     -m "Summed up by the Game measurements workflow (telemetry/sheets.py)."
          gh auth setup-git
          git push --force origin "HEAD:refs/heads/$BRANCH"
          COMPARE="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$BRANCH?expand=1"
          {
            echo "## The game sheets changed"
            echo
            echo "They are on \`$BRANCH\`: open [its pull request]($COMPARE) and merge it after CI."
            if [ -n "$NEW" ]; then
              echo
              echo "New sheets, which change their games' pages in Cartouche, and where the games start: show the pull request's screenshots (Launcher screens) before it is merged."
              echo
              while read -r sheet; do echo "- $sheet"; done <<< "$NEW"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::open the pull request from $BRANCH and merge it: $COMPARE"
