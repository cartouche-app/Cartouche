name: Showcase site

# Publishes the showcase page, site/, on GitHub Pages, at
# https://cartouche.cloud/. When the page changes on main, it runs the page's
# tests, then keeps index.html, the download page, the page for an address the
# site does not have (404.html), the icons, the picture shown where a link to
# the site is shared (social.png) and CNAME alone on the branch gh-pages, which
# Pages serves: Settings › Pages › Build and deployment, Deploy from a branch,
# gh-pages, / (root). CNAME names the domain, which Pages serves the site at
# and sends its old address, cartouche-app.github.io/Cartouche, on to: a
# publication without it would drop the domain (domain/README.md). Nothing
# else of the repository is published (site/README.md) but Cartouche's source
# for the player's own SideStore, app/sidestore-player-source.json, served as
# https://cartouche.cloud/sidestore.json, the address app/config.env gives
# Cartouche (docs/decisions/155.md): merging the Release workflow's "Source"
# pull request publishes it again. Then it deploys the Worker that answers
# with it at https://source.cartouche.cloud/, the address a player adds to
# their SideStore (source/README.md), with the secrets CLOUDFLARE_API_TOKEN
# and CLOUDFLARE_ACCOUNT_ID of the environment cloudflare.
# Each download link gets the newest file of its releases on the way: the
# Builder and Installer workflows run this one again once they have published
# a release.
# The Full test pass checks the page and its links, and publishes nothing
# (full-pass.yml).

on:
  push:
    branches: [main]
    paths: ["site/**", "source/**", ".github/workflows/site.yml", "app/sidestore-player-source.json"]
  # From the Actions tab, and by the Builder and Installer workflows.
  workflow_dispatch:
  # The Full test pass (full-pass.yml): the page checked, never published.
  workflow_call:
    inputs:
      full:
        description: "Check the page, as the Full test pass does, and never publish it"
        type: boolean
        default: false

permissions:
  contents: read

# One publication at a time, the last one wins. The Full test pass's run,
# which publishes nothing, waits for none.
concurrency:
  group: ${{ inputs.full && format('showcase-site-full-{0}', github.run_id) || 'showcase-site' }}
  cancel-in-progress: false

jobs:
  page:
    name: Check the page
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Games of the catalog with their IGDB images by ID, nothing else loaded
      # from another site, no server address, every text in both languages.
      - name: Tests
        run: python3 -m unittest discover -s site/tests -v
      # The Worker that gives the source at source.cartouche.cloud, and its
      # deploy against a stand-in for Cloudflare.
      - name: The source's Worker
        run: |
          node --test source/test/worker.test.js
          python3 -m unittest discover -s source/test -v
      # GitHub's list of the releases, as it is now: the names of Cartouche
      # Builder's and the Installer's files carry their version, and GitHub's
      # latest release is one of the project's three programs only.
      - name: The releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > build/releases.json
      # Each download link marked data-download gets the newest file of its
      # releases (site/tools/downloads.py).
      - name: The files Pages serves
        run: |
          mkdir -p build/site/download
          cp site/index.html site/404.html site/favicon.svg site/apple-touch-icon.png site/social.png site/CNAME build/site/
          cp site/download/index.html build/site/download/
          # The source for the player's own SideStore, as main has it.
          python3 -m json.tool app/sidestore-player-source.json > /dev/null
          cp app/sidestore-player-source.json build/site/sidestore.json
          python3 site/tools/downloads.py --repository "$GITHUB_REPOSITORY" \
            build/releases.json build/site/index.html build/site/download/index.html > build/downloads.md
          cat build/downloads.md
          cat build/downloads.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: showcase-site
          path: build/site
          retention-days: 1
          if-no-files-found: error

  # The only job that can write runs nothing from the repository: it commits
  # the files the first job uploaded. Not in the Full test pass.
  publish:
    name: Publish it on gh-pages
    needs: page
    if: ${{ !inputs.full }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the branch gh-pages
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: showcase-site
          path: site
      - name: Push them to gh-pages
        run: |
          cd site
          # Served as they are, without Jekyll.
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Showcase site of $GITHUB_SHA"
          gh auth setup-git
          git push -q -f "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "HEAD:refs/heads/gh-pages"
          echo "Published on gh-pages, served at https://$(cat CNAME)/" >> "$GITHUB_STEP_SUMMARY"

  # The address a player adds to their SideStore, https://source.cartouche.cloud/:
  # the Worker that answers with the source the job above has just published
  # (source/README.md). Not in the Full test pass.
  source:
    name: Deploy the source's Worker
    needs: publish
    if: ${{ !inputs.full }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: cloudflare
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: source/deploy.sh
