name: Documentation

# Publishes the documentation for players, docs-site/, at
# https://docs.cartouche.cloud/ (docs-site/README.md, decision 161). When it
# changes on main, it builds it with Astro and Starlight, runs its tests, then
# deploys the Worker cartouche-docs, which serves the built pages as
# Cloudflare's static assets, in the account of the zone cartouche.cloud, with
# the secret CLOUDFLARE_DOMAIN_TOKEN of the environment cloudflare, the Domain
# workflow's, as the Showcase site deploys the source's Worker (site.yml).
# The CI builds and checks it on every pull request (ci.yml), and the Full
# test pass with it; this workflow deploys only.

on:
  push:
    branches: [main]
    paths: ["docs-site/**", ".github/workflows/docs.yml"]
  # From the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, the last one wins.
concurrency:
  group: documentation
  cancel-in-progress: false

jobs:
  build:
    name: Build the documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs-site
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # The packages of package-lock.json, as they are, without their install
      # scripts: Astro, Starlight, sharp and wrangler need none.
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build
        run: npm run build
      # Every link and heading, the links out, nothing from another site, no
      # price, every page in each language, and the deploy against stand-ins.
      - name: Tests
        run: npm test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: documentation
          path: docs-site/dist
          retention-days: 1
          if-no-files-found: error

  # The only job with the token: it deploys the pages the first job built.
  deploy:
    name: Deploy it to docs.cartouche.cloud
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # wrangler, at the version package-lock.json pins.
      - name: Install
        working-directory: docs-site
        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: documentation
          path: docs-site/dist
      - name: Deploy
        env:
          CLOUDFLARE_DOMAIN_TOKEN: ${{ secrets.CLOUDFLARE_DOMAIN_TOKEN }}
        run: docs-site/deploy.sh
