# For the screenshots of PR #367 alone, removed before it merges.
name: PromptScreens
options:
  bundleIdPrefix: io.github.clabeuhtegrite.cartouche
  deploymentTarget:
    iOS: "18.0"
targets:
  PromptScreens:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ../../launcher/Sources/CartoucheGameTexts.swift
      - path: ../../launcher/Guest/CartoucheGameTextsEnvironment.m
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.clabeuhtegrite.cartouche.promptscreens
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridging.h
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
